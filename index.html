<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Коллекция Человека-Паука</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a0033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Спайди-Коллекция">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #1a0033 0%, #2d0a4e 50%, #0d1b3e 100%);
    background-attachment: fixed; color: #eee; min-height: 100vh;
    margin: 0; padding: 12px; -webkit-text-size-adjust: 100%;
  }
  h1 {
    text-align: center;
    background: linear-gradient(90deg, #e62429, #ffcc00);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    margin: 0 0 4px; letter-spacing: 1px; word-break: break-word;
  }
  .subtitle { text-align: center; color: #aaa; margin-bottom: 16px; font-size: clamp(0.75rem, 2vw, 0.95rem); }
  .wrap { max-width: 1400px; margin: 0 auto; width: 100%; }
  .panel {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 14px; margin-bottom: 12px; backdrop-filter: blur(10px);
  }
  .filters {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin-bottom: 12px;
  }
  .field { display: flex; flex-direction: column; min-width: 0; }
  .field label {
    font-size: 0.72rem; color: #ffcc00; margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
  }
  input, select {
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 9px 10px; border-radius: 8px; font-size: 0.9rem;
    outline: none; width: 100%; min-width: 0; transition: 0.2s;
  }
  input:focus, select:focus { border-color: #e62429; box-shadow: 0 0 0 3px rgba(230,36,41,0.2); }
  .stats {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px; font-size: 0.85rem; color: #aaa;
    padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); word-break: break-word;
  }
  .stats b { color: #ffcc00; }
  .btn-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn {
    background: linear-gradient(90deg, #e62429, #b8181d); color: #fff;
    border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    font-weight: 600; font-size: 0.8rem; transition: 0.2s; white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.2); }
  .btn.secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
  .btn.secondary:hover { background: rgba(255,255,255,0.2); }
  .btn.gold { background: linear-gradient(90deg, #b8860b, #ffcc00); color: #000; }
  .btn.green { background: linear-gradient(90deg, #15803d, #2ecc71); color: #fff; }
  .btn.orange { background: linear-gradient(90deg, #d35400, #f39c12); color: #fff; }

  .progress-wrap {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
  }
  .progress-section { margin-bottom: 4px; }
  .progress-header { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 0.85rem; margin-bottom: 8px; }
  .progress-header span:first-child { color: #ffcc00; font-weight: 600; }
  .progress-header span:last-child { color: #ccc; }
  .progress-bar { height: 10px; background: rgba(0,0,0,0.4); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #e62429, #ffcc00); transition: width 0.3s ease; border-radius: 6px; }

  .series-progress {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .series-progress-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .series-progress-item.promo {
    border-color: rgba(168, 85, 247, 0.3);
    background: rgba(168, 85, 247, 0.05);
  }
  .series-progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    margin-bottom: 5px;
  }
  .series-progress-header .series-name {
    font-weight: 700;
    color: #ffcc00;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .series-progress-item.promo .series-name { color: #d8b4fe; }
  .series-progress-header .series-count {
    color: #ccc;
    font-variant-numeric: tabular-nums;
  }
  .series-progress-bar {
    height: 6px;
    background: rgba(0,0,0,0.4);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .series-progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .series-progress-fill.s1 { background: linear-gradient(90deg, #e62429, #ff8c00); }
  .series-progress-fill.s2 { background: linear-gradient(90deg, #1e5cb3, #3498db); }
  .series-progress-fill.s3 { background: linear-gradient(90deg, #15803d, #2ecc71); }
  .series-progress-fill.promo { background: linear-gradient(90deg, #7a1fa5, #a855f7); }

  .grade-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
  .grade-stat {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px;
    border-radius: 12px; font-size: 0.75rem;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  }
  .grade-stat .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dup-subtotal {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed rgba(243, 156, 18, 0.3);
    font-size: 0.85rem;
  }
  .dup-subtotal .dup-item {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 12px;
    background: rgba(243, 156, 18, 0.08);
    border: 1px solid rgba(243, 156, 18, 0.3);
    border-radius: 12px;
    color: #f39c12;
  }
  .dup-subtotal .dup-item b { color: #ffcc00; font-size: 1rem; }
  .top-cards { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
  .top-cards-title { font-size: 0.8rem; color: #ffcc00; font-weight: 600; margin-right: 8px; }
  .top-card-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 12px; font-size: 0.75rem;
    background: linear-gradient(90deg, #b8860b, #ffcc00);
    color: #000; font-weight: 700; cursor: pointer; transition: 0.2s; border: none;
  }
  .top-card-chip:hover { filter: brightness(1.15); }

  .cards-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px;
  }
  @media (max-width: 600px) {
    .cards-grid { grid-template-columns: 1fr; gap: 8px; }
    body { padding: 8px; }
    .panel { padding: 10px; }
  }

  .card {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 10px 12px; transition: 0.2s;
    position: relative; display: flex; flex-direction: column; gap: 8px;
    min-width: 0; overflow: hidden; word-break: break-word;
  }
  .card:hover { transform: translateY(-2px); border-color: #e62429; box-shadow: 0 6px 16px rgba(230,36,41,0.2); }
  .card.owned { border-color: #2ecc71; background: rgba(46, 204, 113, 0.07); }
  .card.owned::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 3px; height: 100%; background: #2ecc71;
  }
  .card.has-dup { border-color: #f39c12; }
  .card.has-dup.owned::before { background: linear-gradient(180deg, #2ecc71 50%, #f39c12 50%); }
  .card.promo { border-color: #a855f7; }
  .card.promo.has-dup { border-color: #f39c12; }
  .card.promo::after {
    content: '🎁 ПРОМО'; position: absolute; top: 8px; right: 60px;
    font-size: 0.6rem; font-weight: 700; color: #d8b4fe;
    background: rgba(168, 85, 247, 0.15); padding: 2px 6px; border-radius: 4px;
    letter-spacing: 0.5px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; }
  .card-id { font-size: 0.72rem; color: #888; font-weight: bold; flex-shrink: 0; }
  .owned-check {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 8px; background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
    cursor: pointer; user-select: none; font-size: 0.72rem;
    font-weight: 600; transition: 0.2s; flex-shrink: 0; color: #aaa;
  }
  .owned-check:hover { border-color: rgba(255,255,255,0.3); }
  .owned-check input { width: 14px; height: 14px; accent-color: #2ecc71; cursor: pointer; padding: 0; margin: 0; flex-shrink: 0; }
  .owned-check.checked { background: rgba(46, 204, 113, 0.2); border-color: #2ecc71; color: #2ecc71; }

  .card-name { font-weight: 700; font-size: 0.98rem; color: #fff; line-height: 1.25; overflow-wrap: anywhere; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 4px; font-size: 0.72rem; }
  .badge {
    padding: 2px 7px; border-radius: 10px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    white-space: nowrap;
  }
  .badge.rar-О   { background: #555;    border-color: #777; }
  .badge.rar-СК  { background: #1e5cb3; border-color: #3a7fdd; }
  .badge.rar-УК  { background: #7a1fa5; border-color: #b04de0; }
  .badge.rar-УСК { background: #b8860b; border-color: #ffcc00; color: #000; font-weight: bold; }
  .badge.rar-Ср  { background: #2e7d32; border-color: #4caf50; }
  .badge.series  { background: rgba(230,36,41,0.15); border-color: #e62429; color: #ff9999; }
  .badge.series-promo { background: rgba(168, 85, 247, 0.15); border-color: #a855f7; color: #d8b4fe; }
  .badge.type    { background: rgba(255,204,0,0.08); border-color: rgba(255,204,0,0.4); color: #ffd966; }
  .badge.rating  { font-weight: 800; padding: 2px 9px; }
  .badge.rating.r1 { background: #444;    border-color: #666; color: #bbb; }
  .badge.rating.r2 { background: #1e5cb3; border-color: #3a7fdd; color: #fff; }
  .badge.rating.r3 { background: #2e7d32; border-color: #4caf50; color: #fff; }
  .badge.rating.r4 { background: #b8860b; border-color: #e6a800; color: #000; }
  .badge.rating.r5 { background: #b71c1c; border-color: #e53935; color: #fff; }
  .badge.rating.r6 {
    background: linear-gradient(90deg, #ffd700, #ff8c00);
    border-color: #ffd700; color: #000; box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
  }
  .badge.dup-badge {
    background: linear-gradient(90deg, #f39c12, #e67e22);
    border-color: #f39c12; color: #000; font-weight: 800;
  }

  .grade-chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .grade-chip {
    padding: 4px 7px; font-size: 0.68rem; font-weight: 500;
    border-radius: 5px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04); color: #b8b8b8;
    cursor: pointer; transition: 0.15s; font-family: inherit; line-height: 1;
  }
  .grade-chip:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .grade-chip[data-g="bad"].active       { background:#e74c3c; border-color:#e74c3c; color:#fff; }
  .grade-chip[data-g="medium"].active    { background:#e67e22; border-color:#e67e22; color:#fff; }
  .grade-chip[data-g="good"].active      { background:#f1c40f; border-color:#f1c40f; color:#000; }
  .grade-chip[data-g="great"].active     { background:#2ecc71; border-color:#2ecc71; color:#000; }
  .grade-chip[data-g="nearboost"].active { background:#3498db; border-color:#3498db; color:#fff; }
  .grade-chip[data-g="boost"].active     { background:#9b59b6; border-color:#9b59b6; color:#fff; }
  .grade-chip[data-g="fullboost"].active { background:linear-gradient(90deg,#ffd700,#ff8c00); border-color:#ffd700; color:#000; font-weight:700; }

  .dup-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: rgba(243, 156, 18, 0.08);
    border: 1px solid rgba(243, 156, 18, 0.25);
    border-radius: 6px;
    font-size: 0.72rem;
  }
  .dup-row .dup-label {
    color: #f39c12;
    font-weight: 700;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-size: 0.68rem;
  }
  .dup-btn {
    width: 22px; height: 22px;
    border-radius: 5px;
    border: 1px solid rgba(243, 156, 18, 0.4);
    background: rgba(0,0,0,0.3);
    color: #f39c12;
    font-weight: bold;
    font-size: 0.95rem;
    cursor: pointer;
    line-height: 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .dup-btn:hover:not(:disabled) { background: rgba(243, 156, 18, 0.25); }
  .dup-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .dup-count {
    min-width: 22px;
    text-align: center;
    font-weight: 800;
    color: #f39c12;
    font-size: 0.9rem;
  }

  .card.g-bad       { box-shadow: inset 3px 0 0 #e74c3c; }
  .card.g-medium    { box-shadow: inset 3px 0 0 #e67e22; }
  .card.g-good      { box-shadow: inset 3px 0 0 #f1c40f; }
  .card.g-great     { box-shadow: inset 3px 0 0 #2ecc71; }
  .card.g-nearboost { box-shadow: inset 3px 0 0 #3498db; }
  .card.g-boost     { box-shadow: inset 3px 0 0 #9b59b6; }
  .card.g-fullboost { box-shadow: inset 3px 0 0 #ffd700; }

  .empty { text-align: center; padding: 40px 20px; color: #888; font-size: 1rem; grid-column: 1 / -1; }
  .footer { text-align: center; color: #555; font-size: 0.75rem; margin-top: 24px; padding: 16px; }
  .toast {
    position: fixed; bottom: 16px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: rgba(46, 204, 113, 0.95); color: #fff;
    padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.85rem;
    transition: transform 0.3s ease; z-index: 1000;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: rgba(230, 36, 41, 0.95); }

  .install-banner {
    display: none;
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #e62429, #ffcc00);
    color: #000;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 700;
    z-index: 999;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    cursor: pointer;
    font-size: 0.9rem;
    max-width: calc(100vw - 32px);
    text-align: center;
    border: none;
    transition: transform 0.2s ease;
  }
  .install-banner:hover { transform: translateX(-50%) scale(1.05); }
</style>
</head>
<body>

<h1>🕷 ЧЕЛОВЕК-ПАУК</h1>
<div class="subtitle">Коллекция карточек · 3 серии + Промо · с рейтингами и повторами</div>

<div class="wrap">

  <div class="panel">
    <div class="filters">
      <div class="field">
        <label>🔍 Поиск</label>
        <input type="text" id="search" placeholder="Название карты...">
      </div>
      <div class="field">
        <label>Серия</label>
        <select id="filterSeries">
          <option value="">Все серии</option>
          <option value="1">Серия 1</option>
          <option value="2">Серия 2</option>
          <option value="3">Серия 3</option>
          <option value="Промо">🎁 Промо</option>
        </select>
      </div>
      <div class="field">
        <label>Редкость</label>
        <select id="filterRarity"><option value="">Все</option></select>
      </div>
      <div class="field">
        <label>Рейтинг</label>
        <select id="filterRating">
          <option value="">Любой</option>
          <option value="r1">До 1 (низкий)</option>
          <option value="r2">1 – 2</option>
          <option value="r3">2 – 4</option>
          <option value="r4">4 – 7</option>
          <option value="r5">7 – 15 (топ)</option>
          <option value="r6">15+ (легендарные)</option>
        </select>
      </div>
      <div class="field">
        <label>Мои карточки</label>
        <select id="filterOwned">
          <option value="">Все</option>
          <option value="yes">✅ Только мои</option>
          <option value="no">⬜ Только отсутствующие</option>
        </select>
      </div>
      <div class="field">
        <label>Повторные</label>
        <select id="filterDup">
          <option value="">Все</option>
          <option value="yes">📦 Только с повторами</option>
          <option value="no">Без повторов</option>
        </select>
      </div>
      <div class="field">
        <label>Оценка</label>
        <select id="filterGrade">
          <option value="">Любая</option>
          <option value="none">Без оценки</option>
          <option value="bad">Плохая</option>
          <option value="medium">Средняя</option>
          <option value="good">Хорошая</option>
          <option value="great">Отличная</option>
          <option value="nearboost">Околобуст</option>
          <option value="boost">Буст</option>
          <option value="fullboost">ФулБуст</option>
        </select>
      </div>
      <div class="field">
        <label>Сортировка</label>
        <select id="sortBy">
          <option value="">По номеру</option>
          <option value="rating-desc">По рейтингу ↓</option>
          <option value="rating-asc">По рейтингу ↑</option>
          <option value="name">По названию</option>
          <option value="dup-desc">По повторам ↓</option>
        </select>
      </div>
    </div>
    <div class="stats">
      <div>
        Показано: <b id="countShown">0</b> / <b id="countTotal">0</b>
        · В коллекции: <b id="countOwned">0</b>
        · Повторных: <b id="countDup">0</b>
      </div>
      <div class="btn-group">
        <button class="btn gold" onclick="showTop10()">⭐ Топ-10</button>
        <button class="btn green" onclick="exportMissing()">📋 Недостающие</button>
        <button class="btn orange" onclick="exportDuplicates()">📦 Повторные</button>
        <button class="btn secondary" onclick="exportCollection()">📥 Экспорт</button>
        <button class="btn secondary" onclick="document.getElementById('importFile').click()">📤 Импорт</button>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importCollection(event)">
        <button class="btn" onclick="resetFilters()">Сброс фильтра</button>
        <button class="btn" style="background:linear-gradient(90deg,#555,#333)" onclick="clearCollection()">🗑 Очистить коллекцию</button>
      </div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-section">
      <div class="progress-header">
        <span>📊 Общий прогресс (без промо)</span>
        <span id="progressText">0 / 825 (0%)</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="series-progress" id="seriesProgress"></div>

    <div class="grade-stats" id="gradeStats"></div>
    <div class="dup-subtotal" id="dupSubtotal"></div>
    <div class="top-cards" id="topCards"></div>
  </div>

  <div class="cards-grid" id="cardsGrid"></div>

  <div class="footer">Серии 1–3 · Промо · 925 карточек</div>
</div>

<div class="toast" id="toast"></div>

<button id="installBanner" class="install-banner" onclick="installPWA()">
  📲 Установить приложение
</button>

<script>

const GRADES = [
  { id: 'bad',       label: 'Плохая',    color: '#e74c3c' },
  { id: 'medium',    label: 'Средняя',   color: '#e67e22' },
  { id: 'good',      label: 'Хорошая',   color: '#f1c40f' },
  { id: 'great',     label: 'Отличная',  color: '#2ecc71' },
  { id: 'nearboost', label: 'Околобуст', color: '#3498db' },
  { id: 'boost',     label: 'Буст',      color: '#9b59b6' },
  { id: 'fullboost', label: 'ФулБуст',   color: '#ffd700' }
];
const GRADE_MAP = Object.fromEntries(GRADES.map(g => [g.id, g]));
const STORAGE_KEY = 'spidey_collection_v2';

function promoDisplayNum(id) {
  if (id >= 826 && id <= 920) return id - 825;
  if (id >= 921 && id <= 925) return id - 690;
  return id;
}
function cardDisplayId(id, series) {
  return series === 'Промо' ? promoDisplayNum(id) : id;
}

let ownedSet = new Set();
let grades = {};
let duplicates = {};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data.owned)) ownedSet = new Set(data.owned);
      if (data.grades && typeof data.grades === 'object') grades = data.grades;
      if (data.duplicates && typeof data.duplicates === 'object') duplicates = data.duplicates;
    }
  } catch(e) { console.warn(e); }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      owned: [...ownedSet], grades, duplicates
    }));
  } catch(e) { console.warn(e); }
}

function ratingClass(r) {
  if (r < 1) return 'r1';
  if (r < 2) return 'r2';
  if (r < 4) return 'r3';
  if (r < 7) return 'r4';
  if (r < 15) return 'r5';
  return 'r6';
}
function seriesLabel(s) { return s === 'Промо' ? 'Промо' : 'Серия ' + s; }
function seriesBadgeClass(s) { return s === 'Промо' ? 'series-promo' : 'series'; }
function totalDuplicates() { let sum = 0; Object.values(duplicates).forEach(n => sum += n); return sum; }
function duplicatesCardCount() { return Object.values(duplicates).filter(n => n > 0).length; }

const rarities = [...new Set(CARDS.map(c => c[3]))].sort();
const raritySelect = document.getElementById('filterRarity');
rarities.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; raritySelect.appendChild(o); });
document.getElementById('countTotal').textContent = CARDS.length;

const grid = document.getElementById('cardsGrid');
const searchInput = document.getElementById('search');
const seriesSelect = document.getElementById('filterSeries');
const ownedFilter = document.getElementById('filterOwned');
const dupFilter = document.getElementById('filterDup');
const gradeFilter = document.getElementById('filterGrade');
const ratingFilter = document.getElementById('filterRating');
const sortSelect = document.getElementById('sortBy');

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function toggleOwned(id, checked) {
  if (checked) ownedSet.add(id);
  else { ownedSet.delete(id); delete duplicates[id]; }
  saveState(); updateProgress(); updateStats();
}
function setGrade(id, gId) {
  if (grades[id] === gId) delete grades[id];
  else { grades[id] = gId; ownedSet.add(id); }
  saveState(); updateProgress(); updateStats();
}
function changeDup(id, delta) {
  if (!ownedSet.has(id)) return;
  const cur = duplicates[id] || 0;
  const next = Math.max(0, Math.min(99, cur + delta));
  if (next === 0) delete duplicates[id];
  else duplicates[id] = next;
  saveState();
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (card) {
    const countEl = card.querySelector('.dup-count');
    const minusBtn = card.querySelector('.dup-btn.minus');
    const count = duplicates[id] || 0;
    if (countEl) countEl.textContent = count;
    if (minusBtn) minusBtn.disabled = count <= 0;
    card.classList.toggle('has-dup', count > 0);
    const meta = card.querySelector('.card-meta');
    const oldBadge = meta.querySelector('.dup-badge');
    if (count > 0) {
      if (oldBadge) oldBadge.textContent = `×${count + 1}`;
      else {
        const b = document.createElement('span');
        b.className = 'badge dup-badge';
        b.textContent = `×${count + 1}`;
        meta.appendChild(b);
      }
    } else if (oldBadge) { oldBadge.remove(); }
  }
  updateProgress(); updateStats();
  if (dupFilter.value) render();
}
function onOwnedChange(id, checkbox) { toggleOwned(id, checkbox.checked); render(); }
function onGradeClick(id, gId) {
  setGrade(id, gId);
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;
  const nowGrade = grades[id];
  GRADES.forEach(g => card.classList.remove('g-' + g.id));
  if (nowGrade) card.classList.add('g-' + nowGrade);
  card.querySelectorAll('.grade-chip').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.g === nowGrade);
  });
  if (!ownedSet.has(id)) render();
  else if (gradeFilter.value) render();
}
function showTop10() {
  sortSelect.value = 'rating-desc';
  resetFilters();
  sortSelect.value = 'rating-desc';
  render();
  document.getElementById('cardsGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
  toast('Сортировка по рейтингу ↓ — топ сверху');
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const fSeries = seriesSelect.value;
  const fRarity = raritySelect.value;
  const fOwned = ownedFilter.value;
  const fDup = dupFilter.value;
  const fGrade = gradeFilter.value;
  const fRating = ratingFilter.value;
  const sortBy = sortSelect.value;

  let filtered = CARDS.filter(c => {
    const [id, name, type, rarity, rating, series] = c;
    if (q && !name.toLowerCase().includes(q)) return false;
    if (fSeries && String(series) !== fSeries) return false;
    if (fRarity && rarity !== fRarity) return false;
    if (fOwned === 'yes' && !ownedSet.has(id)) return false;
    if (fOwned === 'no'  && ownedSet.has(id))  return false;
    if (fDup === 'yes' && !(duplicates[id] > 0)) return false;
    if (fDup === 'no'  &&  (duplicates[id] > 0)) return false;
    if (fGrade) {
      const g = grades[id];
      if (fGrade === 'none') { if (g) return false; }
      else if (g !== fGrade) return false;
    }
    if (fRating) { const cls = ratingClass(rating); if (fRating !== cls) return false; }
    return true;
  });

  if (sortBy === 'rating-desc') filtered.sort((a,b) => b[4] - a[4]);
  else if (sortBy === 'rating-asc') filtered.sort((a,b) => a[4] - b[4]);
  else if (sortBy === 'name') filtered.sort((a,b) => a[1].localeCompare(b[1], 'ru'));
  else if (sortBy === 'dup-desc') filtered.sort((a,b) => (duplicates[b[0]] || 0) - (duplicates[a[0]] || 0));
  else filtered.sort((a,b) => a[0] - b[0]);

  document.getElementById('countShown').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">🔍 Ничего не найдено. Попробуй изменить фильтры.</div>';
    return;
  }

  grid.innerHTML = filtered.map(([id, name, type, rarity, rating, series]) => {
    const owned = ownedSet.has(id);
    const grade = grades[id];
    const dupCount = duplicates[id] || 0;
    const gradeCls = grade ? ' g-' + grade : '';
    const isPromo = series === 'Промо';
    const promoCls = isPromo ? ' promo' : '';
    const dupCls = dupCount > 0 ? ' has-dup' : '';
    const shownId = cardDisplayId(id, series);
    const chips = GRADES.map(g =>
      `<button type="button" class="grade-chip${grade === g.id ? ' active' : ''}"
        data-g="${g.id}"
        onclick="onGradeClick(${id}, '${g.id}')"
        title="${g.label}">${g.label}</button>`
    ).join('');

    const ratingBadge = rating > 0
      ? `<span class="badge rating ${ratingClass(rating)}">★ ${rating.toFixed(2)}</span>` : '';
    const dupBadge = dupCount > 0
      ? `<span class="badge dup-badge">×${dupCount + 1}</span>` : '';

    const dupRow = owned ? `
      <div class="dup-row">
        <span class="dup-label">📦 Повтор:</span>
        <button type="button" class="dup-btn minus" ${dupCount <= 0 ? 'disabled' : ''}
          onclick="changeDup(${id}, -1)">−</button>
        <span class="dup-count">${dupCount}</span>
        <button type="button" class="dup-btn plus"
          onclick="changeDup(${id}, +1)">+</button>
      </div>
    ` : '';

    return `
      <div class="card${owned ? ' owned' : ''}${gradeCls}${promoCls}${dupCls}" data-id="${id}">
        <div class="card-top">
          <span class="card-id">#${shownId}</span>
          <label class="owned-check${owned ? ' checked' : ''}">
            <input type="checkbox" ${owned ? 'checked' : ''} onchange="onOwnedChange(${id}, this)">
            <span>Есть</span>
          </label>
        </div>
        <div class="card-name">${escapeHtml(name)}</div>
        <div class="card-meta">
          <span class="badge rar-${escapeHtml(rarity)}">${escapeHtml(rarity)}</span>
          <span class="badge ${seriesBadgeClass(series)}">${seriesLabel(series)}</span>
          ${ratingBadge}
          ${dupBadge}
          ${type && type !== '-' ? `<span class="badge type">${escapeHtml(type)}</span>` : ''}
        </div>
        <div class="grade-chips">${chips}</div>
        ${dupRow}
      </div>
    `;
  }).join('');
}

function updateProgress() {
  const mainCards = CARDS.filter(c => c[5] !== 'Промо');
  const mainTotal = mainCards.length;
  let mainOwned = 0;
  mainCards.forEach(c => { if (ownedSet.has(c[0])) mainOwned++; });
  const pct = mainTotal ? (mainOwned / mainTotal) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent =
    `${mainOwned} / ${mainTotal} (${pct.toFixed(1)}%)`;

  const seriesConfig = [
    { key: 1, label: 'Серия 1', cls: 's1' },
    { key: 2, label: 'Серия 2', cls: 's2' },
    { key: 3, label: 'Серия 3', cls: 's3' },
    { key: 'Промо', label: '🎁 Промо', cls: 'promo', isPromo: true }
  ];

  document.getElementById('seriesProgress').innerHTML = seriesConfig.map(cfg => {
    const cards = CARDS.filter(c => c[5] === cfg.key);
    const total = cards.length;
    let owned = 0;
    cards.forEach(c => { if (ownedSet.has(c[0])) owned++; });
    const p = total ? (owned / total) * 100 : 0;
    return `
      <div class="series-progress-item${cfg.isPromo ? ' promo' : ''}">
        <div class="series-progress-header">
          <span class="series-name">${cfg.label}</span>
          <span class="series-count">${owned} / ${total} (${p.toFixed(1)}%)</span>
        </div>
        <div class="series-progress-bar">
          <div class="series-progress-fill ${cfg.cls}" style="width:${p}%"></div>
        </div>
      </div>
    `;
  }).join('');

  const counts = {};
  GRADES.forEach(g => counts[g.id] = 0);
  let noGrade = 0;
  ownedSet.forEach(id => {
    const g = grades[id];
    if (g && counts[g] !== undefined) counts[g]++;
    else noGrade++;
  });

  document.getElementById('gradeStats').innerHTML = GRADES.map(g => `
    <span class="grade-stat" style="border-color:${g.color}33">
      <span class="dot" style="background:${g.color}"></span>
      ${g.label}: <b style="color:${g.color}">${counts[g.id]}</b>
    </span>
  `).join('') + `
    <span class="grade-stat">
      <span class="dot" style="background:#666"></span>
      Без оценки: <b>${noGrade}</b>
    </span>
  `;

  const totalDup = totalDuplicates();
  const cardsWithDup = duplicatesCardCount();
  const dupEl = document.getElementById('dupSubtotal');
  if (totalDup > 0) {
    dupEl.innerHTML = `
      <span class="dup-item">📦 <b>${totalDup}</b> доп. копий в <b>${cardsWithDup}</b> картах</span>
      <span class="dup-item">💼 <b>${ownedSet.size + totalDup}</b> карт физически (с повторами)</span>
    `;
    dupEl.style.display = 'flex';
  } else {
    dupEl.innerHTML = '';
    dupEl.style.display = 'none';
  }

  const top5 = [...CARDS].sort((a,b) => b[4] - a[4]).slice(0, 5);
  document.getElementById('topCards').innerHTML =
    '<span class="top-cards-title">⭐ Топ-5 рейтинг:</span>' +
    top5.map(c => `
      <button class="top-card-chip" onclick="jumpToCard(${c[0]})" title="Перейти">
        #${cardDisplayId(c[0], c[5])} ${escapeHtml(c[1])} — ${c[4].toFixed(2)}
      </button>
    `).join('');
}

function jumpToCard(id) {
  resetFilters();
  setTimeout(() => {
    const el = document.querySelector(`.card[data-id="${id}"]`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.transition = 'box-shadow 0.4s ease';
      el.style.boxShadow = '0 0 0 3px #ffcc00, 0 8px 24px rgba(255,204,0,0.4)';
      setTimeout(() => { el.style.boxShadow = ''; }, 2000);
    }
  }, 100);
}

function updateStats() {
  document.getElementById('countOwned').textContent = ownedSet.size;
  document.getElementById('countDup').textContent = totalDuplicates();
}

function resetFilters() {
  searchInput.value = '';
  seriesSelect.value = '';
  raritySelect.value = '';
  ownedFilter.value = '';
  dupFilter.value = '';
  gradeFilter.value = '';
  ratingFilter.value = '';
  sortSelect.value = '';
  render();
}

seriesSelect.addEventListener('change', render);

ownedFilter.addEventListener('change', render);

function exportMissing() {
  const q = searchInput.value.trim().toLowerCase();
  const fSeries = seriesSelect.value;
  const fRarity = raritySelect.value;
  const fGrade = gradeFilter.value;
  const fRating = ratingFilter.value;

  const missing = CARDS.filter(c => {
    const [id, name, type, rarity, rating, series] = c;
    if (ownedSet.has(id)) return false;
    if (q && !name.toLowerCase().includes(q)) return false;
    if (fSeries && String(series) !== fSeries) return false;
    if (fRarity && rarity !== fRarity) return false;
    if (fGrade) {
      const g = grades[id];
      if (fGrade === 'none') { if (g) return false; }
      else if (g !== fGrade) return false;
    }
    if (fRating) { const cls = ratingClass(rating); if (fRating !== cls) return false; }
    return true;
  });

  if (missing.length === 0) { toast('Нет недостающих карт с такими фильтрами', true); return; }

  const lines = missing.map(([id, name, type, rarity, rating, series]) =>
    `${cardDisplayId(id, series)}) ${name} - ${rarity}`
  );
  const text = lines.join('\n');
  const blob = new Blob(['\uFEFF' + text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const parts = ['missing'];
  if (fSeries) parts.push('серия-' + fSeries);
  if (fRarity) parts.push('редкость-' + fRarity);
  if (fRating) parts.push('рейтинг-' + fRating);
  if (fGrade) parts.push('грейд-' + fGrade);
  parts.push(new Date().toISOString().slice(0, 10));
  a.download = parts.join('_') + '.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Выгружено ${missing.length} недостающих карт`);
}

function exportDuplicates() {
  const q = searchInput.value.trim().toLowerCase();
  const fSeries = seriesSelect.value;
  const fRarity = raritySelect.value;

  const list = CARDS.filter(c => {
    const [id, name, type, rarity, rating, series] = c;
    if (!(duplicates[id] > 0)) return false;
    if (q && !name.toLowerCase().includes(q)) return false;
    if (fSeries && String(series) !== fSeries) return false;
    if (fRarity && rarity !== fRarity) return false;
    return true;
  }).sort((a,b) => (duplicates[b[0]] || 0) - (duplicates[a[0]] || 0));

  if (list.length === 0) { toast('Нет повторов с такими фильтрами', true); return; }

  const totalDup = list.reduce((s, c) => s + duplicates[c[0]], 0);
  const lines = [
    `Повторные карты — всего ${totalDup} шт в ${list.length} наименованиях`,
    '',
    ...list.map(([id, name, type, rarity, rating, series]) =>
      `${cardDisplayId(id, series)}) ${name} - ${rarity} × ${duplicates[id]} шт`
    )
  ];
  const text = lines.join('\n');
  const blob = new Blob(['\uFEFF' + text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const parts = ['duplicates'];
  if (fSeries) parts.push('серия-' + fSeries);
  if (fRarity) parts.push('редкость-' + fRarity);
  parts.push(new Date().toISOString().slice(0, 10));
  a.download = parts.join('_') + '.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Выгружено ${totalDup} повторных копий`);
}

function exportCollection() {
  const data = {
    exportedAt: new Date().toISOString(),
    total: CARDS.length,
    owned: [...ownedSet].sort((a,b) => a-b),
    grades: grades,
    duplicates: duplicates
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `spidey-collection-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Экспортировано ${ownedSet.size} карточек`);
}

function importCollection(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const arr = Array.isArray(data) ? data : (data.owned || []);
      const valid = arr.filter(x => Number.isInteger(x) && x >= 1 && x <= CARDS.length);
      ownedSet = new Set(valid);
      grades = {};
      duplicates = {};
      if (data.grades && typeof data.grades === 'object') {
        Object.entries(data.grades).forEach(([id, g]) => {
          const nid = parseInt(id);
          if (Number.isInteger(nid) && GRADE_MAP[g]) grades[nid] = g;
        });
      }
      if (data.duplicates && typeof data.duplicates === 'object') {
        Object.entries(data.duplicates).forEach(([id, n]) => {
          const nid = parseInt(id); const nn = parseInt(n);
          if (Number.isInteger(nid) && Number.isInteger(nn) && nn > 0 && nn <= 99) duplicates[nid] = nn;
        });
      }
      saveState(); updateProgress(); updateStats(); render();
      toast(`Импортировано ${valid.length} карточек`);
    } catch (err) {
      toast('Ошибка чтения файла', true); console.error(err);
    }
    ev.target.value = '';
  };
  reader.readAsText(file);
}

function clearCollection() {
  if (!ownedSet.size && !Object.keys(grades).length && !Object.keys(duplicates).length) {
    return toast('Коллекция уже пуста');
  }
  if (!confirm('Удалить все отметки, оценки и повторы? Это действие нельзя отменить.')) return;
  ownedSet.clear(); grades = {}; duplicates = {};
  saveState(); updateProgress(); updateStats(); render();
  toast('Коллекция очищена');
}

let toastTimer;
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (isError ? ' error' : '') + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast' + (isError ? ' error' : ''), 2200);
}

// ======================= PWA =======================
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('installBanner');
  if (banner) banner.style.display = 'block';
});

function installPWA() {
  const banner = document.getElementById('installBanner');
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choice => {
      if (choice.outcome === 'accepted') {
        if (banner) banner.style.display = 'none';
      }
      deferredPrompt = null;
    });
  } else {
    toast('Открой меню браузера и выбери «Установить приложение»');
  }
}

window.addEventListener('appinstalled', () => {
  const banner = document.getElementById('installBanner');
  if (banner) banner.style.display = 'none';
  toast('Приложение установлено! 🎉');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('SW зарегистрирован:', reg.scope))
      .catch(err => console.warn('SW ошибка:', err));
  });
}

loadState();
updateProgress();
updateStats();
render();
</script>
